# Sources:
# https://mutelight.org/practical-tmux
# https://superuser.com/questions/209437/how-do-i-scroll-in-tmux
# https://www.lewuathe.com/tmux/equally-size-pane-of-tmux.html
# https://unix.stackexchange.com/questions/318281/how-to-copy-and-paste-with-a-mouse-with-tmux

# Change prefix stuff
set-option -g prefix C-a
bind-key C-a last-window

# Make it easy to edit config file
bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"
bind-key M split-window -h "vim ~/.tmux.conf"

# Use zsh
set-option -g default-shell /bin/zsh

# Start numbering at 1
set -g base-index 1

# Renumber windows when one closes
set-option -g renumber-windows on

# Highlight active window
set-window-option -g window-status-current-style bg=red
set-option -g pane-active-border-style bg=blue

# Put bar on top
set-option -g status-position top

# Add padding around session name in status bar
# Note: for more control, could also use:
# set -g status-left "#[bg=green,fg=black] #S #[default] "
set -g status-left " #S   "
set -g status-left-length 20

# Allows for faster key repetition
set -s escape-time 0

# Allow scrolling
set -g mouse on

# Ctrl-a should still go to beginning of line
bind a send-prefix

# To copy, left click and drag to highlight text in yellow, 
# once you release left click yellow text will disappear and will automatically be available in clibboard
# # Use vim keybindings in copy mode
setw -g mode-keys vi
# Update default binding of `Enter` to also use copy-pipe
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# This next split section should help with even splits

# split -v S
unbind S
## bind S split-window <- this is an original line.
bind S split-window \; select-layout even-vertical

# split vertically
unbind |
## bind | split-window <- this is an original line.
bind | split-window -h \; select-layout even-horizontal

# Send command to panes sitting idle at a shell prompt.
# Panes running vim, a long job, or in copy-mode are skipped: the filter keeps
# only panes whose foreground process is still the shell itself. This is an
# allowlist rather than a denylist of commands, which could never be complete.
# Note on quoting: the run string is format-expanded by tmux before the shell
# sees it, so '#' is doubled and '$' escaped to survive to the inner list-panes.
# '%1' is the command-prompt substitution and is deliberately not doubled.
# Cribbed from:
# https://scripter.co/command-to-every-pane-window-session-in-tmux/
# #send-command-to-all-panes-in-all-sessions
bind E command-prompt -p "Command:" \
       "run \"tmux list-panes -a \
                -f \\\"##{&&:##{m/r:^(zsh|bash|sh|fish)\\$,##{pane_current_command}},##{==:##{pane_in_mode},0}}\\\" \
                -F '##{session_name}:##{window_index}.##{pane_index}' \
              | xargs -I PANE tmux send-keys -t PANE '%1' Enter\""

# Claude Code
# https://code.claude.com/docs/en/terminal-config#configure-tmux
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
